<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#08090c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Eyefinder</title>
  
  <!-- Modern Inter Font & Leaflet Map Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  
  <!-- Premium Dark Theme Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark">
  <!-- Minimalist Gated Login Screen (The ONLY markup loaded when unauthenticated) -->
  <div id="login-view" class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <span class="brand-dot"></span>
        <h1 class="brand-name">Eyefinder</h1>
      </div>
      <p class="login-subtitle">Private System Access</p>
      
      <form id="gate-form" class="login-form" autocomplete="off">
        <div class="input-wrapper">
          <input 
            type="password" 
            id="gate-passkey-input" 
            class="login-input" 
            placeholder="Enter access key" 
            required 
            autofocus 
            autocomplete="current-password"
          />
          <button type="button" id="btn-toggle-pw" class="pw-toggle" aria-label="Toggle password visibility" tabindex="-1">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        
        <div id="gate-error" class="login-error hidden"></div>
        
        <div class="login-footer-row">
          <label class="remember-label">
            <input type="checkbox" id="gate-remember-me" checked />
            <span>Remember on this device</span>
          </label>
        </div>

        <button type="submit" id="btn-unlock-gate" class="login-btn">
          <span>Enter</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>
    </div>
  </div>

  <!-- Dynamic Application Mount (100% EMPTY until verified authentication) -->
  <div id="app-view" class="app-wrapper hidden"></div>

  <!-- Global Toast -->
  <div id="app-toast" class="app-toast hidden"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Main Application Script -->
  <script src="app.js"></script>
</body>
</html>
